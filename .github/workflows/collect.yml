# Collects Yr + WeatherNext + Frost about every 3 hours, scores finished days,
# and publishes the webpage. GitHub starts scheduled runs late or drops them, so the
# cron fires hourly and a gate step ends the run early (successfully, collecting and
# deploying nothing) while the last successful collect is under 150 min old.
# Working state lives on the `state` branch, which is replaced (not appended) on
# every collecting run, so the repository does not grow with it.
name: Collect, score and publish

on:
  schedule:
    - cron: "23 * * * *"   # every hour at :23 UTC; most runs stop at the gate
  workflow_dispatch:
    inputs:
      trigger:
        description: "Manual bypasses the gate; timer respects the 150-minute interval"
        type: choice
        options:
          - manual
          - timer
        default: manual

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WX_STATE_DIR: state
      WX_STATE_KEY: ${{ secrets.WX_STATE_KEY }}
      GH_TOKEN: ${{ github.token }}
      # Off unless the repo variable is set to 1 (DECISIONS.md, "WeatherNext terms").
      WX_PUBLISH_FORECAST_VALUES: ${{ vars.WX_PUBLISH_FORECAST_VALUES || '0' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # cloud.persistence supplies scoped auth through environment

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/requirements.txt

      - run: pip install -r cloud/requirements.txt

      - name: Restore and validate working state (only a missing branch starts fresh)
        run: python -m cloud.persistence restore

      - name: Gate (skip if the last successful collect is under 150 min old)
        id: due
        run: python -m cloud.run due ${{ github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual' && '--manual' || '' }}

      - name: Collect, score, export
        if: steps.due.outputs.run == 'true'
        env:
          MET_USER_AGENT: ${{ secrets.MET_USER_AGENT }}
          FROST_CLIENT_ID: ${{ secrets.FROST_CLIENT_ID }}
          EARTH_ENGINE_PROJECT: ${{ secrets.EARTH_ENGINE_PROJECT }}
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          WEATHERNEXT_ENABLED: ${{ vars.WEATHERNEXT_ENABLED || '1' }}
        run: python -m cloud.run all

      - name: Push encrypted history, confirm origin, then prune and push leased state
        if: steps.due.outputs.run == 'true'
        run: python -m cloud.persistence publish

      - name: Rebuild page from confirmed history and state
        if: steps.due.outputs.run == 'true'
        run: python -m cloud.run export

      - uses: actions/configure-pages@v6
        if: steps.due.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.due.outputs.run == 'true'
        with:
          path: site
      - id: deploy
        if: steps.due.outputs.run == 'true'
        uses: actions/deploy-pages@v5

      - name: Report source failures after preserving data and publishing health
        if: steps.due.outputs.run == 'true'
        run: python -m cloud.run check

# Collects Yr + WeatherNext + Frost every 6 hours, scores finished days,
# and publishes the webpage. Working state lives on the `state` branch, which is
# replaced (not appended) on every run, so the repository does not grow with it.
name: Collect, score and publish

on:
  schedule:
    - cron: "17 */6 * * *"   # 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/requirements.txt

      - run: pip install -r cloud/requirements.txt

      - name: Restore working state
        run: |
          git clone --depth 1 --branch state \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state \
            || mkdir -p state
          rm -rf state/.git

      - name: Collect, score, export
        env:
          MET_USER_AGENT: ${{ secrets.MET_USER_AGENT }}
          FROST_CLIENT_ID: ${{ secrets.FROST_CLIENT_ID }}
          EARTH_ENGINE_PROJECT: ${{ secrets.EARTH_ENGINE_PROJECT }}
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          WEATHERNEXT_ENABLED: ${{ vars.WEATHERNEXT_ENABLED || '1' }}
          WX_PUBLISH_FORECAST_VALUES: ${{ vars.WX_PUBLISH_FORECAST_VALUES || '0' }}
          WX_STATE_DIR: state
        run: python -m cloud.run all

      - name: Save working state (single commit, replaced each run)
        run: |
          cd state
          git init -q -b state
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "state $(date -u +%FT%TZ)"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state

      - name: Commit newly scored days
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add history
          if ! git diff --cached --quiet; then
            git commit -q -m "Scored days $(date -u +%F)"
            git pull -q --rebase origin "${GITHUB_REF_NAME}"
            git push -q origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
